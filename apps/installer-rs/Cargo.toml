[package]
name = "plog-installer"
version = "0.1.0"
edition = "2021"
description = "Plog CMS Installer"
license = "MIT"

[[bin]]
name = "plog-install"
path = "src/main.rs"

[dependencies]
plog-core = { path = "../../plog-rs/crates/core" }
plog-settings = { path = "../../plog-rs/crates/settings" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1.0", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = "0.11"
indicatif = "0.17"
colored = "2"
anyhow = "1"
