<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类 - Plog</title>
  <link rel="stylesheet" href="style.css?v=20260429f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">plog</a>
      <nav class="nav">
        <a href="/" class="nav-link">文章</a>
        <a href="/nav.html" class="nav-link">导航</a>
        <a href="/library.html" class="nav-link">书库</a>
        <a href="/mcp.html" class="nav-link">MCP</a>
        <a href="/skill.html" class="nav-link">技能</a>
        <a href="/about.html" class="nav-link">关于</a>
        <button class="search-btn" id="searchBtn" title="搜索 (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <h1 class="page-title">分类</h1>
      <p class="page-subtitle">按主题浏览文章</p>

      <div class="category-list" id="categoryList">
        <div class="loading">加载中...</div>
      </div>

      <div class="empty-state" id="empty-state" style="display: none;">
        <p>暂无分类</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Plog. 基于 Rust 构建.</p>
    </div>
  </footer>

  <div class="theme-switcher" id="themeSwitcher">
    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <div class="theme-menu" id="themeMenu">
      <div class="theme-group-label">基础</div>
      <button class="theme-option" data-theme="zen" data-intensity="light"><span class="theme-preview zen"></span><span>暗夜</span></button>
      <button class="theme-option" data-theme="sepia" data-intensity="light"><span class="theme-preview sepia"></span><span>羊皮纸</span></button>
      <button class="theme-option" data-theme="night" data-intensity="dark"><span class="theme-preview night"></span><span>黑曜石</span></button>
      <div class="theme-group-label">自然</div>
      <button class="theme-option" data-theme="forest" data-intensity="light"><span class="theme-preview forest"></span><span>森林</span></button>
      <button class="theme-option" data-theme="ocean" data-intensity="light"><span class="theme-preview ocean"></span><span>海洋</span></button>
      <div class="theme-group-label">暖色</div>
      <button class="theme-option" data-theme="sunset" data-intensity="light"><span class="theme-preview sunset"></span><span>落日</span></button>
      <button class="theme-option" data-theme="nordic" data-intensity="light"><span class="theme-preview nordic"></span><span>北欧</span></button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="search.js"></script>
  <script src="category.js"></script>
  <script src="reading-mode.js"></script>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function loadCategories() {
      Promise.all([
        fetch('/api/categories').then(function(r) { return r.json(); }),
        fetch('/api/posts?status=n&per_page=100').then(function(r) { return r.json(); })
      ]).then(function(results) {
        var catData = results[0];
        var postData = results[1];
        var cats = (catData.success && catData.data) ? catData.data : [];
        var posts = (postData.success && postData.data && postData.data.items) ? postData.data.items : [];

        if (cats.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          document.getElementById('categoryList').innerHTML = '';
          return;
        }

        var countMap = {};
        posts.forEach(function(p) {
          if (p.sortid) {
            countMap[p.sortid] = (countMap[p.sortid] || 0) + 1;
          }
        });

        var html = '';
        cats.forEach(function(cat) {
          var count = countMap[cat.sid] || 0;
          html += '<div class="category-item">';
          html += '<div class="category-name"><a href="/?category=' + cat.sid + '">' + escapeHtml(cat.sortname) + '</a></div>';
          if (cat.description) {
            html += '<div class="category-desc">' + escapeHtml(cat.description) + '</div>';
          }
          html += '<div class="category-count">' + count + ' 篇文章</div>';
          html += '</div>';
        });
        document.getElementById('categoryList').innerHTML = html;
      }).catch(function() {
        document.getElementById('empty-state').style.display = 'block';
        document.getElementById('categoryList').innerHTML = '';
      });
    }

    loadCategories();
  </script>
</body>
</html>
