<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plog CMS</title>
  <meta name="description" content="Plog - A minimal, high-performance blog CMS built with Rust">
  <link rel="stylesheet" href="style.css?v=20260429f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">plog</a>
      <nav class="nav">
        <a href="/" class="nav-link active">文章</a>
        <a href="/nav.html" class="nav-link">导航</a>
        <a href="/library.html" class="nav-link">书库</a>
        <a href="/mcp.html" class="nav-link">MCP</a>
        <a href="/skill.html" class="nav-link">技能</a>
        <a href="/about.html" class="nav-link">关于</a>
        <button class="search-btn" id="searchBtn" title="搜索 (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <h1 class="page-title" id="pageTitle">文章</h1>
      <p class="page-subtitle" id="pageSubtitle">记录思考，分享知识</p>

      <section class="posts" id="posts">
      </section>

      <div class="empty-state" id="empty-state" style="display: none;">
        <p>暂无文章</p>
      </div>

      <div class="pagination" id="pagination" style="display: none;">
        <button id="prevBtn" onclick="loadPage(currentPage - 1)">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" onclick="loadPage(currentPage + 1)">下一页</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Plog. 基于 Rust 构建.</p>
    </div>
  </footer>

  <div class="theme-switcher" id="themeSwitcher">
    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <div class="theme-menu" id="themeMenu">
      <div class="theme-group-label">基础</div>
      <button class="theme-option" data-theme="zen" data-intensity="light">
        <span class="theme-preview zen"></span>
        <span>暗夜</span>
      </button>
      <button class="theme-option" data-theme="sepia" data-intensity="light">
        <span class="theme-preview sepia"></span>
        <span>羊皮纸</span>
      </button>
      <button class="theme-option" data-theme="night" data-intensity="dark">
        <span class="theme-preview night"></span>
        <span>黑曜石</span>
      </button>
      <div class="theme-group-label">自然</div>
      <button class="theme-option" data-theme="forest" data-intensity="light">
        <span class="theme-preview forest"></span>
        <span>森林</span>
      </button>
      <button class="theme-option" data-theme="ocean" data-intensity="light">
        <span class="theme-preview ocean"></span>
        <span>海洋</span>
      </button>
      <div class="theme-group-label">暖色</div>
      <button class="theme-option" data-theme="sunset" data-intensity="light">
        <span class="theme-preview sunset"></span>
        <span>落日</span>
      </button>
      <button class="theme-option" data-theme="nordic" data-intensity="light">
        <span class="theme-preview nordic"></span>
        <span>北欧</span>
      </button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="search.js"></script>
  <script src="category.js"></script>
  <script src="reading-mode.js"></script>
  <script>
    var categories = [];
    var currentPage = 1;
    var totalPages = 1;
    var activeCategoryId = null;

    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTimestamp(ts) {
      if (!ts) return '';
      var d = new Date(ts * 1000);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function getCategoryName(sortid) {
      for (var i = 0; i < categories.length; i++) {
        if (categories[i].sid === sortid) {
          return categories[i].sortname;
        }
      }
      return '';
    }

    function fetchCategories() {
      fetch('/api/categories')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.success && data.data) {
            categories = data.data;
          }
        })
        .catch(function() {});
    }

    function fetchPosts() {
      var url = '/api/posts?status=n&page=' + currentPage + '&per_page=10';
      if (activeCategoryId) {
        url += '&category_id=' + activeCategoryId;
      }
      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.success && data.data && data.data.items && data.data.items.length > 0) {
            renderPosts(data.data.items);
            var pg = data.data.pagination || {};
            totalPages = pg.total_pages || 1;
            currentPage = pg.page || 1;
            renderPagination(pg);
          } else {
            document.getElementById('posts').innerHTML = '';
            document.getElementById('empty-state').style.display = 'block';
            document.getElementById('pagination').style.display = 'none';
          }
        })
        .catch(function() {
          document.getElementById('empty-state').style.display = 'block';
        });
    }

    function renderPosts(posts) {
      var container = document.getElementById('posts');
      var html = '';
      posts.forEach(function(post) {
        var dateStr = formatTimestamp(post.date);
        var catName = getCategoryName(post.sortid);
        var excerpt = post.excerpt || '';
        if (!excerpt && post.content) {
          excerpt = post.content.replace(/[#*`\n]/g, ' ').substring(0, 120) + '...';
        }
        html += '<article class="post-card">';
        html += '<a href="/post.html?id=' + post.gid + '" class="post-link">';
        html += '<time class="post-date">' + escapeHtml(dateStr) + '</time>';
        html += '<h2 class="post-title">' + escapeHtml(post.title) + '</h2>';
        html += '<p class="post-excerpt">' + escapeHtml(excerpt) + '</p>';
        if (catName) {
          html += '<div class="post-meta"><span class="post-category">' + escapeHtml(catName) + '</span></div>';
        }
        html += '</a></article>';
      });
      container.innerHTML = html;
      document.getElementById('empty-state').style.display = 'none';
    }

    function renderPagination(pg) {
      var paginationEl = document.getElementById('pagination');
      if (!pg || pg.total <= pg.per_page) {
        paginationEl.style.display = 'none';
        return;
      }
      paginationEl.style.display = 'flex';
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
      document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages;
    }

    function loadPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      fetchPosts();
      window.scrollTo(0, 0);
    }

    document.addEventListener('categoryChange', function(e) {
      activeCategoryId = e.detail.categoryId;
      currentPage = 1;
      var titleEl = document.getElementById('pageTitle');
      var subtitleEl = document.getElementById('pageSubtitle');
      if (activeCategoryId) {
        var catName = getCategoryName(activeCategoryId);
        titleEl.textContent = catName || '分类文章';
        subtitleEl.textContent = '筛选分类下的文章';
      } else {
        titleEl.textContent = '文章';
        subtitleEl.textContent = '记录思考，分享知识';
      }
      fetchPosts();
    });

    fetchCategories();
    fetchPosts();
  </script>
</body>
</html>
