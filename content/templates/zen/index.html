<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plog - 我的博客</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">Plog</a>
      <nav class="nav">
        <a href="/" class="nav-link active">文章</a>
        <a href="/categories" class="nav-link">分类</a>
        <a href="/about" class="nav-link">关于</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <section class="posts" id="posts">
        <article class="post-card">
          <a href="#" class="post-link">
            <time class="post-date">2026-04-02</time>
            <h2 class="post-title">欢迎来到 Plog</h2>
            <p class="post-excerpt">这是一个基于 Rust 构建的现代化博客系统。简洁、快速、专注于内容创作。</p>
            <div class="post-meta">
              <span class="post-category">公告</span>
            </div>
          </a>
        </article>
      </section>

      <div class="empty-state" id="empty-state" style="display: none;">
        <p>暂无文章</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Plog. 保留所有权利。</p>
    </div>
  </footer>

  <script>
    // 从 API 获取文章列表
    async function fetchPosts() {
      try {
        const res = await fetch('/api/posts');
        const data = await res.json();
        
        if (data.success && data.data && data.data.items && data.data.items.length > 0) {
          renderPosts(data.data.items);
        }
      } catch (e) {
        console.log('API not available, using static content');
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('posts');
      container.innerHTML = posts.map(post => `
        <article class="post-card">
          <a href="/post/${post.id}" class="post-link">
            <time class="post-date">${formatDate(post.created_at)}</time>
            <h2 class="post-title">${escapeHtml(post.title)}</h2>
            <p class="post-excerpt">${escapeHtml(post.excerpt || '')}</p>
            <div class="post-meta">
              ${post.category ? `<span class="post-category">${escapeHtml(post.category.name)}</span>` : ''}
            </div>
          </a>
        </article>
      `).join('');
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toISOString().split('T')[0];
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 页面加载时获取文章
    fetchPosts();
  </script>
</body>
</html>
