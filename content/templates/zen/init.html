<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plog CMS - 系统初始化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    .form {
      padding: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #303133;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .form-group .error {
      color: #f56c6c;
      font-size: 12px;
      margin-top: 5px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .btn.loading {
      position: relative;
    }
    .btn.loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .tips {
      margin-top: 20px;
      padding: 15px 20px;
      background: #f5f7fa;
      border-radius: 8px;
      font-size: 13px;
      color: #606266;
    }
    .tips h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #303133;
    }
    .tips ul {
      padding-left: 20px;
    }
    .tips li {
      margin-bottom: 5px;
    }
    .success-message {
      text-align: center;
      padding: 40px;
    }
    .success-message .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .success-message h2 {
      color: #67c23a;
      margin-bottom: 10px;
    }
    .success-message p {
      color: #909399;
      margin-bottom: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="setup-container">
    <div class="header">
      <h1>🏁 Plog CMS 初始化设置</h1>
      <p>首次部署，请设置管理员账户</p>
    </div>
    
    <form class="form" id="setup-form" onsubmit="return handleSubmit(event)">
      <div class="form-group">
        <label for="username">用户名</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="请输入管理员用户名"
          required
          minlength="3"
          maxlength="20"
        >
        <div class="error" id="username-error"></div>
      </div>
      
      <div class="form-group">
        <label for="nickname">昵称</label>
        <input 
          type="text" 
          id="nickname" 
          name="nickname" 
          placeholder="请输入昵称"
          required
        >
        <div class="error" id="nickname-error"></div>
      </div>
      
      <div class="form-group">
        <label for="password">密码</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="请输入密码（至少6位）"
          required
          minlength="6"
        >
        <div class="error" id="password-error"></div>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">确认密码</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          placeholder="请再次输入密码"
          required
        >
        <div class="error" id="confirmPassword-error"></div>
      </div>
      
      <button type="submit" class="btn" id="submit-btn">
        创建管理员账户
      </button>
    </form>
    
    <div class="tips">
      <h3>💡 提示</h3>
      <ul>
        <li>用户名将作为登录账号使用</li>
        <li>密码至少需要6个字符</li>
        <li>建议设置强密码并妥善保管</li>
      </ul>
    </div>
  </div>
  
  <div class="container hidden" id="success-container">
    <div class="success-message">
      <div class="icon">✅</div>
      <h2>初始化成功！</h2>
      <p>管理员账户已创建，正在跳转到登录页...</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('setup-form');
    const submitBtn = document.getElementById('submit-btn');
    const setupContainer = document.getElementById('setup-container');
    const successContainer = document.getElementById('success-container');
    
    function showError(fieldId, message) {
      const errorEl = document.getElementById(fieldId + '-error');
      if (errorEl) errorEl.textContent = message;
    }
    
    function clearErrors() {
      document.querySelectorAll('.error').forEach(el => el.textContent = '');
    }
    
    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.classList.toggle('loading', loading);
      submitBtn.textContent = loading ? '创建中' : '创建管理员账户';
    }
    
    async function checkStatus() {
      try {
        const res = await fetch('/api/init/status', { method: 'POST' });
        const data = await res.json();
        
        if (data.initialized) {
          setupContainer.classList.add('hidden');
          successContainer.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = '/admin/';
          }, 2000);
          return true;
        }
      } catch (e) {
        console.error('Status check failed:', e);
      }
      return false;
    }
    
    async function handleSubmit(e) {
      e.preventDefault();
      clearErrors();
      
      const username = document.getElementById('username').value;
      const nickname = document.getElementById('nickname').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (username.length < 3 || username.length > 20) {
        showError('username', '用户名长度在 3 到 20 个字符');
        return false;
      }
      
      if (password.length < 6) {
        showError('password', '密码长度不能少于 6 个字符');
        return false;
      }
      
      if (password !== confirmPassword) {
        showError('confirmPassword', '两次输入的密码不一致');
        return false;
      }
      
      setLoading(true);
      
      try {
        const res = await fetch('/api/init/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, nickname, password })
        });
        
        const data = await res.json();
        
        if (data.success) {
          setupContainer.classList.add('hidden');
          successContainer.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = '/admin/';
          }, 2000);
        } else {
          alert(data.message || '创建失败，请重试');
          setLoading(false);
        }
      } catch (e) {
        alert('网络错误，请重试');
        setLoading(false);
      }
      
      return false;
    }
    
    checkStatus();
  </script>
</body>
</html>
