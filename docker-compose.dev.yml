version: '3.8'

services:
  # Nginx Web 服务器
  web:
    image: nginx:alpine
    container_name: plog-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - plog-network
    restart: unless-stopped

  # PHP 应用容器
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plog-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks:
      - plog-network
    restart: unless-stopped

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: plog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: plog
      MYSQL_USER: plog
      MYSQL_PASSWORD: plog_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - plog-network
    restart: unless-stopped

  # Composer 容器 (用于安装依赖)
  composer:
    image: composer:2.0
    container_name: plog-composer
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: install --ignore-platform-reqs
    networks:
      - plog-network

volumes:
  mysql-data:

networks:
  plog-network:
    driver: bridge
