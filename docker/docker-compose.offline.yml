# =============================================================================
# Plog CMS Docker Compose - 离线部署版
# 
# 使用预构建的镜像，无需在线构建
# =============================================================================

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: plog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plog}
      MYSQL_USER: ${MYSQL_USER:-plog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-plog123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - plog-network

  # Rust API 服务（使用预构建镜像）
  api:
    image: plog-api:local
    container_name: plog-api
    environment:
      PLOG__DATABASE__URL: mysql://${MYSQL_USER:-plog}:${MYSQL_PASSWORD:-plog123}@mysql:3306/${MYSQL_DATABASE:-plog}
      PLOG__AUTH__JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PLOG__SERVER__HOST: 0.0.0.0
      PLOG__SERVER__PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api_uploads:/app/content/uploads
      - api_plugins:/app/content/plugins
      - api_themes:/app/content/themes
      - api_cache:/app/content/cache
      - api_logs:/app/content/logs
    restart: unless-stopped
    networks:
      - plog-network

  # 管理后台前端（使用预构建镜像）
  admin-web:
    image: plog-admin-web:latest
    container_name: plog-admin-web
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - plog-network

  # 前台展示网站（使用预构建镜像）
  frontend:
    image: plog-frontend:latest
    container_name: plog-frontend
    ports:
      - "8082:80"
    volumes:
      - frontend_uploads:/usr/share/nginx/html/uploads
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - plog-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: plog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - admin-web
      - frontend
    restart: unless-stopped
    networks:
      - plog-network

volumes:
  mysql_data:
  api_uploads:
  api_plugins:
  api_themes:
  api_cache:
  api_logs:
  frontend_uploads:
  nginx_logs:

networks:
  plog-network:
    driver: bridge
