# =============================================================================
# Plog CMS Docker Compose
# 
# 纯 Rust 架构
# =============================================================================

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: plog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: plog
      MYSQL_USER: plog
      MYSQL_PASSWORD: plog123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Plog API 服务
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plog-api
    environment:
      DATABASE_URL: mysql://plog:plog123@mysql:3306/plog
      JWT_SECRET: your-secret-key-here
      RUST_LOG: plog_api=debug
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api_data:/app/content
    restart: unless-stopped

  # Admin Web 前端
  admin-web:
    image: node:20-alpine
    container_name: plog-admin-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../apps/admin-web:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: plog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../plog-rs/config/nginx/plog.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - admin-web
    restart: unless-stopped

volumes:
  mysql_data:
  api_data:
