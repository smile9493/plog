# =============================================================================
# Plog CMS Docker Compose - 生产环境
# 
# 完整的建站系统，包含：
# - 后端 API 服务 (Rust)
# - 管理后台 (Vue 3)
# - 前台展示网站
# - MySQL 数据库
# - Nginx 反向代理
# =============================================================================

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: plog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plog}
      MYSQL_USER: ${MYSQL_USER:-plog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-plog123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - plog-network

  # Rust API 服务
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: plog-api
    environment:
      PLOG__DATABASE__URL: mysql://${MYSQL_USER:-plog}:${MYSQL_PASSWORD:-plog123}@mysql:3306/${MYSQL_DATABASE:-plog}
      PLOG__AUTH__JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PLOG__SERVER__HOST: 0.0.0.0
      PLOG__SERVER__PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,mysql"
      no_proxy: "localhost,127.0.0.1,mysql"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api_uploads:/app/content/uploads
      - api_plugins:/app/content/plugins
      - api_themes:/app/content/themes
      - api_cache:/app/content/cache
      - api_logs:/app/content/logs
      # 挂载本地构建的二进制文件（需在WSL中编译）
      - ../plog-rs/target/release/plog-api:/app/plog-api:ro
    restart: unless-stopped
    networks:
      - plog-network

  # 管理后台前端
  admin-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin-web
    container_name: plog-admin-web
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - plog-network

  # 前台展示网站
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: plog-frontend
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "8082:80"
    volumes:
      - frontend_uploads:/usr/share/nginx/html/uploads
    restart: unless-stopped
    networks:
      - plog-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: plog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - admin-web
      - frontend
    restart: unless-stopped
    networks:
      - plog-network

volumes:
  mysql_data:
  api_uploads:
  api_plugins:
  api_themes:
  api_cache:
  api_logs:
  frontend_uploads:
  nginx_logs:

networks:
  plog-network:
    driver: bridge
