openapi: 3.0.3
info:
  title: Plog CMS API
  description: Plog CMS 系统 API 接口规范
  version: 1.0.0
  contact:
    name: Plog Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: https://admin.example.com/api/v1
    description: 生产环境

tags:
  - name: Auth
    description: 认证相关接口
  - name: Posts
    description: 文章管理接口
  - name: Categories
    description: 分类管理接口
  - name: Comments
    description: 评论管理接口
  - name: Notes
    description: 笔记管理接口
  - name: Users
    description: 用户管理接口
  - name: Media
    description: 媒体管理接口
  - name: Tags
    description: 标签管理接口
  - name: Tags
    description: 标签管理接口

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 用户登出
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/user:
    get:
      tags: [Auth]
      summary: 获取当前用户信息
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts:
    get:
      tags: [Posts]
      summary: 获取文章列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: count
          in: query
          schema:
            type: integer
            default: 20
        - name: sort_id
          in: query
          schema:
            type: integer
        - name: keyword
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [date, views, comnum]
            default: date
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'

    post:
      tags: [Posts]
      summary: 创建文章
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCreateResponse'

  /posts/{id}:
    get:
      tags: [Posts]
      summary: 获取文章详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: password
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '404':
          description: 文章不存在

  /categories:
    get:
      tags: [Categories]
      summary: 获取分类列表
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'

  /comments:
    get:
      tags: [Comments]
      summary: 获取评论列表
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'

  /notes:
    get:
      tags: [Notes]
      summary: 获取笔记列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: count
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'

    post:
      tags: [Notes]
      summary: 发布笔记
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteCreateResponse'

  /media/upload:
    post:
      tags: [Media]
      summary: 上传文件
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                sid:
                  type: integer
                author_uid:
                  type: integer
                  default: 1
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'

  /tags:
    get:
      tags: [Tags]
      summary: 获取标签列表
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: popular
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Tags]
      summary: 创建标签
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagname]
              properties:
                tagname:
                  type: string
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tags/{id}:
    get:
      tags: [Tags]
      summary: 获取标签详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [Tags]
      summary: 更新标签
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagname:
                  type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [Tags]
      summary: 删除标签
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /comments/{id}/approve:
    post:
      tags: [Comments]
      summary: 审核通过评论
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 审核成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: AUTH_COOKIE
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    User:
      type: object
      properties:
        uid:
          type: integer
        username:
          type: string
        nickname:
          type: string
        role:
          type: string
        email:
          type: string
        avatar:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: '#/components/schemas/User'

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        cover:
          type: string
        url:
          type: string
        description:
          type: string
        date:
          type: string
        author_id:
          type: integer
        author_name:
          type: string
        author_avatar:
          type: string
        sort_id:
          type: integer
        sort_name:
          type: string
        views:
          type: integer
        comnum:
          type: integer
        like_count:
          type: integer
        top:
          type: string
        sortop:
          type: string
        tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
        need_pwd:
          type: string
        fields:
          type: object
        parent_id:
          type: integer

    PostListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            articles:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            page:
              type: integer
            total_pages:
              type: integer
            has_more:
              type: boolean

    PostDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            article:
              type: object
              properties:
                id:
                  type: integer
                title:
                  type: string
                date:
                  type: string
                sort_id:
                  type: integer
                sort_name:
                  type: string
                type:
                  type: string
                author_id:
                  type: integer
                author_name:
                  type: string
                author_avatar:
                  type: string
                content:
                  type: string
                content_raw:
                  type: string
                excerpt:
                  type: string
                excerpt_raw:
                  type: string
                cover:
                  type: string
                views:
                  type: integer
                comnum:
                  type: integer
                like_count:
                  type: integer
                top:
                  type: string
                sortop:
                  type: string
                tags:
                  type: array
                fields:
                  type: object
                parent_id:
                  type: integer

    PostCreateRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        excerpt:
          type: string
        author_uid:
          type: integer
        post_date:
          type: string
        sort_id:
          type: integer
        tags:
          type: string
        cover:
          type: string
        draft:
          type: string
          enum: [y, n]
          default: n
        alias:
          type: string
        top:
          type: string
          enum: [y, n]
          default: n
        sortop:
          type: string
          enum: [y, n]
          default: n
        allow_remark:
          type: string
          enum: [y, n]
          default: y
        password:
          type: string
        link:
          type: string
        template:
          type: string

    PostCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            article_id:
              type: integer

    Category:
      type: object
      properties:
        sid:
          type: integer
        sortname:
          type: string
        pid:
          type: integer
        children:
          type: array
          items:
            type: object

    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sorts:
              type: object

    Comment:
      type: object
      properties:
        id:
          type: integer
        gid:
          type: integer
        pid:
          type: integer
        content:
          type: string
        author:
          type: string
        email:
          type: string
        url:
          type: string
        ip:
          type: string
        date:
          type: string
        status:
          type: string

    CommentListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    Note:
      type: object
      properties:
        id:
          type: integer
        t:
          type: string
        t_raw:
          type: string
        date:
          type: string
        author_id:
          type: integer
        author_name:
          type: string
        author_avatar:
          type: string
        ip:
          type: string

    NoteListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            notes:
              type: array
              items:
                $ref: '#/components/schemas/Note'

    NoteCreateRequest:
      type: object
      required: [t]
      properties:
        t:
          type: string
        private:
          type: string
          enum: [y, n]
          default: n
        author_uid:
          type: integer

    NoteCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            note_id:
              type: integer

    MediaUploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
    media_id:
      type: integer
    url:
      type: string
    file_info:
      type: object

    Tag:
      type: object
      properties:
        tid:
          type: integer
        tagname:
          type: string
        usenum:
          type: integer

    TagListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
