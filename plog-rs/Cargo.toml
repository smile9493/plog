[workspace]
resolver = "2"
members = [
    # 微内核架构 - 基础包
    "packages/plog-core",
    "packages/plog-shared",
    
    # 微内核架构 - 功能模块
    "modules/content",
    "modules/auth",
    "modules/settings",
    "modules/media",
    "modules/audit",
    
    # 微内核架构 - 扩展
    "extensions/plugin",
    "extensions/theme",
    
    # API 服务
    "plog-api",
    
    # 数据库迁移
    "migrations",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Web 框架
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "compression-deflate", "compression-zstd", "limit", "timeout"] }

# 数据库
sea-orm = { version = "1.0", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "1.0"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 配置
config = "0.14"

# 认证
jsonwebtoken = "9"
argon2 = "0.5"

# 错误处理
thiserror = "1"
anyhow = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 验证
validator = { version = "0.18", features = ["derive"] }

# 速率限制
tower_governor = "0.4"

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# 异步
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"

# TOML 解析
toml = "0.8"

# 并发数据结构
dashmap = "6"

# 基准测试
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
