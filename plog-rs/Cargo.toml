[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/core",
    "crates/auth",
    "crates/content",
    "crates/settings",
    "crates/media",
    "crates/audit",
    "crates/plugin",
    "crates/theme",
    "crates/cache",
    "crates/api",
    "migrations",
]

[package]
name = "plog-server"
version = "0.1.0"
edition = "2021"
description = "Plog CMS Server"
license = "MIT"

[[bin]]
name = "plog-api"
path = "src/main.rs"

[dependencies]
plog-api = { path = "crates/api" }
tokio = { workspace = true }
anyhow = { workspace = true }

[workspace.dependencies]
# Web 框架
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "compression-deflate", "compression-zstd"] }

# 数据库
sea-orm = { version = "1.0", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "1.0"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 配置
config = "0.14"

# 认证
jsonwebtoken = "9"
argon2 = "0.5"

# 错误处理
thiserror = "1"
anyhow = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# 异步
async-trait = "0.1"
futures = "0.3"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
