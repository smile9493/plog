# Plog API 配置

[app]
name = "Plog CMS"
env = "development"
debug = true

[database]
url = "mysql://plog:plog123@localhost:3306/plog"
max_connections = 10
min_connections = 2

[auth]
jwt_secret = "your-secret-key-change-in-production"
jwt_expiration = 86400

[server]
host = "0.0.0.0"
port = 8080

[cors]
allowed_origins = ["http://localhost:3000", "http://localhost:5173"]

[cors]
allowed_origins = ["http://localhost:3000", "http://localhost:5173"]
