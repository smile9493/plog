# =============================================================================
# Plog CMS Nginx Configuration
# 
# Phase 7: 纯 Rust 架构
# - /api/*    → Rust Core Service
# - /admin    → admin-web 前端
# - /admin-web → admin-web 前端
#
# 无 PHP 依赖
# =============================================================================

# 上游服务器定义
upstream rust_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream admin_web {
    server 127.0.0.1:5173;
    keepalive 16;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name admin.example.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# 主 HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # SSL 配置
    include /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    # 根目录
    root /var/www/plog;
    index index.html;

    # 日志配置
    access_log /var/log/nginx/plog-access.log;
    error_log /var/log/nginx/plog-error.log;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =========================================================================
    # Rust API - 统一 API 入口
    # =========================================================================
    location /api/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        
        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        
        # CORS 头
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # =========================================================================
    # 管理后台 (/admin 重定向到 /admin-web)
    # =========================================================================
    location = /admin {
        return 301 /admin-web/;
    }

    location /admin/ {
        return 301 /admin-web/$request_uri;
    }

    # =========================================================================
    # 管理后台前端 (admin-web)
    # =========================================================================
    location /admin-web/ {
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # 静态资源
    # =========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # =========================================================================
    # 上传文件
    # =========================================================================
    location /uploads/ {
        alias /var/www/plog/content/uploadfile/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # =========================================================================
    # SPA 路由 (Vue Router)
    # =========================================================================
    location / {
        try_files $uri $uri/ /admin-web/index.html;
    }

    # =========================================================================
    # 健康检查端点
    # =========================================================================
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
